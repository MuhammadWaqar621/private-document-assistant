name: querynest

services:
  postgres:
    # pgvector/pgvector ships the same Postgres as the upstream image plus
    # the `vector` extension preinstalled (not enabled until the Alembic
    # migration runs `CREATE EXTENSION IF NOT EXISTS vector` - see
    # backend/alembic/versions/) - matches Vercel Postgres (Neon-backed),
    # which supports pgvector natively, so local dev and the deployed
    # database behave the same way with no separate vector service.
    image: pgvector/pgvector:pg16
    container_name: querynest-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: querynest
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
    container_name: querynest-backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: ${DATABASE_URL}
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./backend:/app

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8000}
    container_name: querynest-frontend
    restart: unless-stopped
    ports:
      - "4173:4173"
    depends_on:
      - backend

volumes:
  postgres_data:
